spring.application.name=products-command
server.port=8081

# Conexión a MySQL (puerto 3307 según tu contenedor)
spring.datasource.url=jdbc:mysql://localhost:3307/db_kafka?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Mexico_City
spring.datasource.username=root
spring.datasource.password=claudio
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true


spring.cloud.function.definition=handleCommands
spring.cloud.stream.bindings.handleCommands-in-0.destination=products.commands
spring.cloud.stream.bindings.handleCommands-in-0.content-type=application/json
spring.cloud.stream.bindings.handleCommands-in-0.group=products-command
spring.cloud.stream.kafka.bindings.handleCommands-in-0.consumer.startOffset=latest

spring.cloud.stream.bindings.handleCommands-out-0.destination=products.replies
spring.cloud.stream.bindings.handleCommands-out-0.content-type=application/json
spring.cloud.stream.kafka.binder.brokers=localhost:9092